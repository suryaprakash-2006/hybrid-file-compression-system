<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hybrid File Compression System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background: linear-gradient(120deg,#1c1c1c,#2c5364);
color:white;
font-family:Segoe UI;
}

.card{
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-weight:700;
}

.upload-icon{
font-size:40px;
margin-bottom:10px;
color:#0d6efd;
}

#engineStatus{
font-size:14px;
}

</style>

</head>


<body>

<div class="container mt-5">

<div class="header">

<h1>Hybrid File Compression System</h1>

<p class="text-light">
8086 RLE Compression Engine 
</p>

</div>

<div id="engineStatus" class="alert alert-secondary" role="alert">
Checking engine status...
</div>


<div class="row g-4">


<!-- Compression Card -->
<div class="col-md-6">

<div class="card p-4 text-center">

<div class="upload-icon">
<i class="fas fa-file-zipper"></i>
</div>

<h4>Compress File</h4>

<form action="/compress" method="post" enctype="multipart/form-data">

<div class="mb-3 mt-3">
<input class="form-control" type="file" name="file">
</div>

<div class="mb-3">
<select class="form-select" name="engine">
<option value="auto" selected>Engine: Auto</option>
<option value="8086">Engine: 8086</option>
<option value="python">Engine: Python</option>
</select>
</div>

<button class="btn btn-primary w-100">
Compress File
</button>

</form>

</div>

</div>



<!-- Decompression Card -->
<div class="col-md-6">

<div class="card p-4 text-center">

<div class="upload-icon">
<i class="fas fa-file-export"></i>
</div>

<h4>Decompress File</h4>

<form action="/decompress" method="post" enctype="multipart/form-data">

<div class="mb-3 mt-3">
<input class="form-control" type="file" name="file">
</div>

<div class="mb-3">
<select class="form-select" name="engine">
<option value="auto" selected>Engine: Auto</option>
<option value="8086">Engine: 8086</option>
<option value="python">Engine: Python</option>
</select>
</div>

<button class="btn btn-success w-100">
Decompress File
</button>

</form>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-md-12">

<div class="card p-4">

<h4 class="text-center">Integrity Verification</h4>

<form action="/verify" method="post" enctype="multipart/form-data">

<div class="mb-3 mt-3">
<label class="form-label">Original File</label>
<input class="form-control" type="file" name="original">
</div>

<div class="mb-3">
<label class="form-label">Decompressed File</label>
<input class="form-control" type="file" name="decompressed">
</div>

<button class="btn btn-warning w-100">
Verify Integrity
</button>

</form>

</div>

</div>

</div>


<!-- Footer -->

<div class="text-center mt-5">

<p class="text-light">
&copy; 2026 hybrid compression system.
</p>

</div>

</div>

</body>

<script>
fetch('/engine-status')
	.then(response => response.json())
	.then(status => {
		const el = document.getElementById('engineStatus');
		const ready8086 = status.compression_program && status.decompression_program && status.dosbox_available;

		if (ready8086) {
			el.className = 'alert alert-success';
			el.textContent = '8086 engine is connected and ready.';
			return;
		}

		el.className = 'alert alert-warning';
		el.textContent = '8086 engine is partially available. Python fallback will be used when runtime requirements are missing.';
	})
	.catch(() => {
		const el = document.getElementById('engineStatus');
		el.className = 'alert alert-danger';
		el.textContent = 'Could not fetch engine status.';
	});
</script>
</html>
