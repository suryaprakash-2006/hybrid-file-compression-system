<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hybrid File Compression System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background: linear-gradient(120deg,#1c1c1c,#2c5364);
color:white;
font-family:Segoe UI;
}

.card{
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-weight:700;
}

.upload-icon{
font-size:40px;
margin-bottom:10px;
color:#0d6efd;
}

</style>

</head>


<body>

<div class="container mt-5">

<div class="header">

<h1>Hybrid File Compression System</h1>

<p class="text-light">
8086 RLE Compression Engine 
</p>

</div>


<div class="row g-4">


<!-- Compression Card -->
<div class="col-md-6">

<div class="card p-4 text-center">

<div class="upload-icon">
<i class="fas fa-file-zipper"></i>
</div>

<h4>Compress File</h4>

<form action="/compress" method="post" enctype="multipart/form-data">

<div class="mb-3 mt-3">
<input class="form-control" type="file" name="file">
</div>

<button class="btn btn-primary w-100">
Compress File
</button>

</form>

</div>

</div>



<!-- Decompression Card -->
<div class="col-md-6">

<div class="card p-4 text-center">

<div class="upload-icon">
<i class="fas fa-file-export"></i>
</div>

<h4>Decompress File</h4>

<form action="/decompress" method="post" enctype="multipart/form-data">

<div class="mb-3 mt-3">
<input class="form-control" type="file" name="file">
</div>

<button class="btn btn-success w-100">
Decompress File
</button>

</form>

</div>

</div>

</div>


<!-- Footer -->

<div class="text-center mt-5">

<p class="text-light">
&copy; 2026 hybrid compression system.
</p>

</div>

</div>

</body>
</html>
